project:
  type: website
  output-dir: _site
  render:
    - index.qmd
    - methods.qmd
  pre-render: web/build.sh
  resources:
    - web/dist/oil-flows.js

website:
  title: "Oil Flows 2026"
  search: false
  navbar:
    background: light
    left:
      - text: Flows
        href: index.qmd
      - text: Method
        href: methods.qmd

format:
  html:
    theme: [default, site.scss]
    anchor-sections: false
    include-in-header:
      text: |
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fira+Sans+Condensed:wght@500;600&family=Roboto+Condensed:wght@400;600;700&display=swap" />
        <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 16 16%27%3E%3Cpath fill=%27%23c2480f%27 d=%27M8 1s5 6 5 9a5 5 0 0 1-10 0c0-3 5-9 5-9z%27/%3E%3C/svg%3E" />
